#cloud-config
package_update: true
packages:
  - curl
write_files:
  - path: /usr/local/sbin/wt-default-host-tools
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu

      curl --proto '=https' --tlsv1.2 -LsSf \
        https://raw.githubusercontent.com/lucasavila00/diffo/main/install.sh | sh

runcmd:
  - [/usr/local/sbin/wt-default-host-tools]
