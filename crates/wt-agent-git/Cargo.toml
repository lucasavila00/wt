[package]
name = "wt-agent-git"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Scoped Git transport for WT worlds"

[[bin]]
name = "wt-agent-git-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "wt-agent-git-relay"
path = "src/bin/relay.rs"

[[bin]]
name = "git-remote-ag"
path = "src/bin/git-remote-ag.rs"

[[bin]]
name = "wt-agent-git-client"
path = "src/bin/client.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
