mutation GitlabUpdateMergeRequest($project: ID!, $iid: String!, $title: String, $description: String, $state: MergeRequestNewState) {
  mergeRequestUpdate(input: {
    projectPath: $project
    iid: $iid
    title: $title
    description: $description
    state: $state
  }) { errors mergeRequest { id iid webUrl } }
}

mutation GitlabSetMergeRequestDraft($project: ID!, $iid: String!, $draft: Boolean!) {
  mergeRequestSetDraft(input: { projectPath: $project, iid: $iid, draft: $draft }) {
    errors
    mergeRequest { id iid webUrl }
  }
}

mutation GitlabAddMergeRequestComment($id: NoteableID!, $body: String!) {
  createNote(input: { noteableId: $id, body: $body }) {
    errors
    note { id url }
  }
}

mutation GitlabReplyToDiscussion($id: NoteableID!, $discussion: DiscussionID!, $body: String!, $head: String!) {
  createNote(input: {
    noteableId: $id
    discussionId: $discussion
    body: $body
    mergeRequestDiffHeadSha: $head
  }) { errors note { id url } }
}

mutation GitlabSetDiscussionResolved($discussion: DiscussionID!, $resolve: Boolean!) {
  discussionToggleResolve(input: { id: $discussion, resolve: $resolve }) {
    errors
    discussion { id resolved }
  }
}
