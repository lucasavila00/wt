[package]
name = "wt-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local wt workstation CLI (binary name: wt)"

[features]
default = []
guest = ["dep:wt-agent-tool-gateway", "dep:wt-codex-integration"]

[[bin]]
name = "wt"
path = "src/main.rs"

[[bin]]
name = "wtg"
path = "src/wtg.rs"
required-features = ["guest"]

[dependencies]
wt-control-protocol = { workspace = true }
wt-agent-tool-gateway = { workspace = true, optional = true }
wt-codex-integration = { path = "../codex-integration", optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
nix = { workspace = true }
nucleo-matcher = { workspace = true }
portable-pty = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
ssh-key = { workspace = true }
signal-hook = { workspace = true }
tempfile = "3.27.0"
termwiz = { workspace = true }
toml = { workspace = true }
time = { workspace = true }
vt100 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
