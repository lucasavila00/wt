[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '''if [ "$INSIDE_DEVCONTAINER" = "true" ]; then
  echo 'This session is running inside a devcontainer: an isolated, disposable Linux environment defined by .devcontainer/. Package installs and system-level changes are safe here and do not affect the host machine. This environment can run the full test suite just like CI, using the same commands CI uses. The devcontainer has ag-git installed for pull or merge request, review, and CI operations on the current worktree branch; run ag-git help to see its supported commands. Use normal Git for commits, fetches, pulls, and pushes. The Git gateway requires branch names to use the shared wt/ prefix (for example, wt/fix-login). Every WT world for the project may update, force-push, or delete any branch under wt/, so an agent can continue or take over work from another agent. If the gateway rejects a branch, rename it with git branch -m wt/NAME.'
fi'''
