# Install-input sample for scripts/install-server --config PATH.
version = 1

[capacity]
version = 1
limits = { vcpus = 32, memory_mib = 131072, disk_gib = 2048 }

[image]
source_url = "https://cloud-images.ubuntu.com/releases/noble/release-20260615/ubuntu-24.04-server-cloudimg-amd64.img"
source_sha256 = "5fa5b05e5ec239858c4531485d6023b0896448c2df7c63b34f8dae6ea6051a44"
path = "/var/lib/wt/images/wt-retained-ubuntu-24.04-amd64.qcow2"
build_memory_mib = 8192
build_vcpus = 8
build_disk_gib = 32

[libvirt]
network = "default"
worlds_dir = "/var/lib/libvirt/images/wt"

[agent_tools]
vsock_port = 18017

[agent_tools.github]
host = "github.com"
# Personal access token (classic) with the repo scope; see GETTING-STARTED.md.
api_token_file = "~/.config/wt/credentials/github.token"
ssh_private_key_file = "~/.ssh/id_ed25519"
ssh_public_key_file = "~/.ssh/id_ed25519.pub"

[guest]
boot_timeout_seconds = 300
readiness_timeout_seconds = 900

[install]
binary_dir = "/usr/local/bin"
