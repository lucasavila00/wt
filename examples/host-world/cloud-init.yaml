#cloud-config
package_update: true
packages:
  - build-essential
  - ca-certificates
  - curl
  - git
  - libvirt-dev
  - pkg-config
write_files:
  - path: /usr/local/sbin/wt-project-development
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu

      run_as_wt() {
        runuser --user wt -- env HOME=/home/wt "$@"
      }

      run_as_wt sh -c \
        'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable'
      run_as_wt /home/wt/.cargo/bin/rustup component add clippy rustfmt

      run_as_wt sh -c \
        'curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh'

      run_as_wt git clone https://github.com/lucasavila00/wt.git /home/wt/wt

      for command in cargo cargo-clippy cargo-fmt clippy-driver rustc rustdoc rustfmt rustup; do
        ln -sf "/home/wt/.cargo/bin/$command" "/usr/local/bin/$command"
      done
      ln -sf /home/wt/.local/bin/codex /usr/local/bin/codex

      run_as_wt sh -c \
        'cd /home/wt/wt && cargo clippy --workspace --all-targets -- -D warnings'
      touch /var/lib/wt-host-example-ready
      echo "WT host project development ready"
runcmd:
  - [/usr/local/sbin/wt-project-development]
