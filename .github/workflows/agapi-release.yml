name: Release agapi
on:
  push:
    tags: ["agapi-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate version and build independent product
        run: |
          version="${GITHUB_REF_NAME#agapi-v}"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' crates/products/agapi/Cargo.toml)" = "$version"
          cargo build --locked --release -p agapi
          export CODEX_RELEASE="$(cat crates/products/agapi/codex-version)"
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          AGAPI_CODEX_TEST_BINARY="$HOME/.codex/packages/standalone/current/bin/codex" cargo test --locked -p agapi -- --include-ignored
          install -m 0755 target/release/agapi agapi
          install -m 0644 crates/products/agapi/codex-version codex-version
          tar -czf agapi-x86_64-linux.tar.gz agapi codex-version
          sha256sum agapi-x86_64-linux.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agapi-x86_64-linux.tar.gz
            SHA256SUMS
