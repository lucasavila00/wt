name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Limit test parallelism
        run: |
          wt_ci_jobs=$(( $(nproc) / 2 ))
          if [ "$wt_ci_jobs" -lt 1 ]; then wt_ci_jobs=1; fi
          echo "CARGO_BUILD_JOBS=$wt_ci_jobs" >> "$GITHUB_ENV"
          echo "WT_CI_TEST_THREADS=$wt_ci_jobs" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libvirt-dev openssh-server ripgrep shellcheck

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run static analysis
        run: make static

      - name: Run tests
        run: cargo test --workspace --locked -- --test-threads "$WT_CI_TEST_THREADS"

  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Limit test parallelism
        run: |
          wt_ci_jobs=$(( $(nproc) / 2 ))
          if [ "$wt_ci_jobs" -lt 1 ]; then wt_ci_jobs=1; fi
          echo "CARGO_BUILD_JOBS=$wt_ci_jobs" >> "$GITHUB_ENV"
          echo "WT_CI_TEST_THREADS=$wt_ci_jobs" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libvirt-dev openssh-server

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace tests
        run: cargo test --workspace --locked --no-run

      - name: Run tests under scheduler contention
        run: |
          timeout --signal=TERM --kill-after=10s 180s \
            taskset --cpu-list 0 \
            cargo test --workspace --locked -- --test-threads "$WT_CI_TEST_THREADS"
