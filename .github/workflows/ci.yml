name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libvirt-dev openssh-server ripgrep shellcheck

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run checks
        run: make ci

  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libvirt-dev openssh-server

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace tests
        run: scripts/cargo test --workspace --locked --no-run

      - name: Run tests under scheduler contention
        run: |
          timeout --signal=TERM --kill-after=10s 180s \
            taskset --cpu-list 0 \
            scripts/cargo test --workspace --locked -- --test-threads=16
