name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libvirt-dev openssh-server ripgrep shellcheck tmux

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.2"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        run: |
          npm install --global npm@11.17.0
          npm ci

      - name: Install Elixir dependencies
        working-directory: clients/elixir/wt_api
        run: |
          mix local.hex --force
          mix deps.get --check-locked

      - name: Run checks
        run: make ci

  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libvirt-dev openssh-server tmux

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace tests
        run: cargo test --workspace --locked --no-run

      - name: Run tests under scheduler contention
        run: |
          timeout --signal=TERM --kill-after=10s 180s \
            taskset --cpu-list 0 \
            cargo test --workspace --locked -- --test-threads=16
