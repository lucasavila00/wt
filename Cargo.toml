[workspace]
resolver = "2"
members = [
    "crates/products/wt/client",
    "crates/products/wt/control-protocol",
    "crates/products/wt/server",
    "crates/products/wt/retained-worlds",
    "crates/products/wt/devcontainer-guest-tools",
    "crates/products/wt/codex-integration",
    "crates/products/wt/server-installer",
    "crates/products/gh-actions-runner/service",
    "crates/products/agent-tools/gateway",
    "crates/products/agent-tools/tools",
    "crates/products/git-proxy/service",
    "crates/products/git-proxy/installer",
    "crates/shared/libvirt-kvm",
    "crates/shared/workload-registry",
    "crates/shared/git-smart-protocol",
    "crates/shared/installer-support",
    "crates/tests/end-to-end",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
wt-agent-tool-gateway = { path = "crates/products/agent-tools/gateway" }
wt-client = { path = "crates/products/wt/client" }
wt-control-protocol = { path = "crates/products/wt/control-protocol" }
wt-tools = { path = "crates/products/agent-tools/tools" }
wt-git-proxy = { path = "crates/products/git-proxy/service" }
wt-git-smart-protocol = { path = "crates/shared/git-smart-protocol" }
wt-installer-support = { path = "crates/shared/installer-support" }
wt-libvirt-kvm = { path = "crates/shared/libvirt-kvm" }
wt-retained-worlds = { path = "crates/products/wt/retained-worlds" }
wt-server = { path = "crates/products/wt/server" }
wt-workload-registry = { path = "crates/shared/workload-registry" }
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
cliclack = "0.5.4"
console = "0.16.4"
nix = { version = "0.31.2", features = ["signal", "user"] }
quick-xml = "0.39.2"
base64 = "0.22.1"
insta = "1.47.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
diesel = { version = "2.3.11", features = ["sqlite"] }
diesel_migrations = "2.3.2"
graphql_client = "0.16.0"
libsqlite3-sys = { version = "0.36.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
thiserror = "2.0.18"
toml = "1.0.3"
tempfile = "3.27.0"
ureq = { version = "3.4.0", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
virt = { version = "0.4.3", features = ["qemu"] }
zeroize = { version = "1.9.0", features = ["derive"] }
